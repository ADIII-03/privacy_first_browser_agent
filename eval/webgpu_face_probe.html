<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WebGPU face-model probe — YOLOv8n-face</title>
<meta name="color-scheme" content="light" />
<style>
  :root { color-scheme: light; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; color: #111; background: #fafafa; }
  h1 { font-size: 16px; }
  #log { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; padding: 14px; border-radius: 8px; }
  .ok { color: #067d34; } .bad { color: #b00020; } .dim { color: #666; }
  canvas { border: 1px solid #ccc; margin-top: 10px; max-width: 320px; height: auto; }
</style>
</head>
<body>
<h1>WebGPU face-model probe — YOLOv8n-face</h1>
<p class="dim">Measures REAL in-browser WebGPU inference for the exact model we'll ship, using the
same pre/post as eval/face_probe.js. This answers the "is it WebGPU-feasible?" question with a real number.</p>
<div id="log">starting…</div>
<canvas id="cv" width="640" height="640"></canvas>

<!-- Dev probe only: loading ORT-web from CDN is fine on localhost. The real MV3 extension
     will vendor onnxruntime-web same-origin (CSP) — that does not change inference speed. -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>
<script>
const CONF = 0.35, IOU = 0.45, SIZE = 640;
const MODEL_URL = "./models/yolov8n-face.onnx";
const IMAGE_URL = "./person.png"; // change to ./signature.png to confirm 0 faces
const logEl = document.getElementById("log");
const log = (msg, cls) => { logEl.innerHTML += `\n${cls ? `<span class="${cls}">${msg}</span>` : msg}`; console.log(msg); };

function loadImage(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("could not load " + url)); im.src = url; });
}

async function main() {
  logEl.textContent = "";
  log(`navigator.gpu present: ${!!navigator.gpu}`, navigator.gpu ? "ok" : "bad");
  if (typeof ort === "undefined") { log("ORT-web failed to load from CDN.", "bad"); return; }
  ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
  ort.env.wasm.numThreads = 1; // avoid needing cross-origin isolation on a plain http server

  // ---- letterbox the image onto a 640x640 canvas (pad 114), identical to face_probe.js ----
  const img = await loadImage(IMAGE_URL);
  const W = img.naturalWidth, H = img.naturalHeight;
  const scale = Math.min(SIZE / W, SIZE / H);
  const newW = Math.round(W * scale), newH = Math.round(H * scale);
  const padX = Math.floor((SIZE - newW) / 2), padY = Math.floor((SIZE - newH) / 2);
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  ctx.fillStyle = "rgb(114,114,114)"; ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.drawImage(img, padX, padY, newW, newH);
  log(`image: ${W}x${H}  ->  letterboxed ${SIZE}x${SIZE} (scale ${scale.toFixed(3)}, pad ${padX},${padY})`);

  const rgba = ctx.getImageData(0, 0, SIZE, SIZE).data;
  const plane = SIZE * SIZE, chw = new Float32Array(3 * plane);
  for (let i = 0; i < plane; i++) { chw[i] = rgba[i*4]/255; chw[plane+i] = rgba[i*4+1]/255; chw[2*plane+i] = rgba[i*4+2]/255; }

  // ---- session on WebGPU (fall back to wasm so we still get a number + learn WebGPU failed) ----
  const buf = await (await fetch(MODEL_URL)).arrayBuffer();
  log(`model fetched: ${(buf.byteLength/1e6).toFixed(1)} MB`);
  let session, ep = "webgpu";
  const tLoad = performance.now();
  try { session = await ort.InferenceSession.create(buf, { executionProviders: ["webgpu"] }); }
  catch (e) { ep = "wasm (WEBGPU FAILED)"; log("WebGPU EP create failed: " + e.message, "bad"); session = await ort.InferenceSession.create(buf, { executionProviders: ["wasm"] }); }
  log(`session ready on ${ep} in ${Math.round(performance.now()-tLoad)} ms`, ep === "webgpu" ? "ok" : "bad");
  log(`inputs: ${session.inputNames}  outputs: ${session.outputNames}`);

  const feeds = {}; feeds[session.inputNames[0]] = new ort.Tensor("float32", chw, [1,3,SIZE,SIZE]);

  await session.run(feeds); // warmup (first run pays kernel-compile cost)
  const times = [];
  let out;
  for (let k = 0; k < 10; k++) { const t = performance.now(); const r = await session.run(feeds); times.push(performance.now()-t); out = r[session.outputNames[0]]; }
  times.sort((a,b)=>a-b);
  const median = times[Math.floor(times.length/2)];
  log(`\ninference over 10 runs on ${ep}: median ${median.toFixed(1)} ms  (min ${times[0].toFixed(1)}, max ${times[times.length-1].toFixed(1)})`, "ok");
  log(`output dims: [${out.dims.join(", ")}]`);

  // ---- decode YOLOv8 head (score at index 4), undo letterbox, NMS — same as face_probe.js ----
  const dims = out.dims, d = out.data;
  let C, N, cf;
  if (dims[1] <= dims[2]) { C = dims[1]; N = dims[2]; cf = true; } else { C = dims[2]; N = dims[1]; cf = false; }
  const at = (c,n) => cf ? d[c*N+n] : d[n*C+c];
  const cand = [];
  for (let n = 0; n < N; n++) { const s = at(4,n); if (s < CONF) continue;
    const cx=at(0,n), cy=at(1,n), w=at(2,n), h=at(3,n);
    cand.push({ x:(cx-w/2-padX)/scale, y:(cy-h/2-padY)/scale, w:w/scale, h:h/scale, score:s }); }
  cand.sort((a,b)=>b.score-a.score);
  const iou = (a,b) => { const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);
    const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1), uni=a.w*a.h+b.w*b.h-inter; return uni<=0?0:inter/uni; };
  const keep = []; for (const b of cand) if (keep.every(k=>iou(k,b)<IOU)) keep.push(b);
  log(`\n${keep.length} face(s) after NMS:`);
  keep.slice(0,20).forEach((b,i)=>log(`  #${i}  score=${b.score.toFixed(2)}  box=[${Math.round(b.x)}, ${Math.round(b.y)}, ${Math.round(b.w)}, ${Math.round(b.h)}]`));

  log(`\nWhat to look for: ep should say "webgpu" (not the fallback), median ms is the real per-frame GPU cost,`, "dim");
  log(`and the face box should match what face_probe.js found in Node (~[128,138,43,54] on person.png).`, "dim");
}
main().catch(e => log("ERROR: " + (e.message || e), "bad"));
</script>
</body>
</html>
