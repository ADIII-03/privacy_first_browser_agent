[project]
name = "pba-server"
version = "0.3.0"
description = "Privacy Browser Agent — stateless reasoning tier (sanitized context in, validated ActionPlan out)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[dependency-groups]
# Needed only for selftest.py (TestClient) — never imported by main.py
dev = ["httpx>=0.27"]

[tool.uv]
# Deterministic installs from uv.lock; the mock backend keeps runtime deps to 3.
